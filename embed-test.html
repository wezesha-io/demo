<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Plain page with the plugin</title>
<style>body{font:16px/1.5 Georgia,serif;max-width:640px;margin:40px auto;padding:0 16px}</style>
</head>
<body>
  <!-- Not built by Vite, no framework: just the one script tag at the bottom. -->
  <h1>Library opening hours</h1>
  <p>Monday to Friday 8am to 6pm. Saturday 9am to 1pm.</p>
  <p><a href="https://en.wikipedia.org/wiki/Library">What is a library?</a></p>
  <form onsubmit="event.preventDefault(); document.getElementById('r').textContent='Booked for ' + this.who.value + ' on ' + this.day.value">
    <p><label>Your name <input name="who" /></label></p>
    <p><label>Day <select name="day"><option>Monday</option><option>Tuesday</option><option>Wednesday</option><option>Thursday</option><option>Friday</option><option>Saturday</option></select></label></p>
    <p><button>Book a study room</button></p>
  </form>
  <p id="r"></p>
  <script type="module" src="/voicenav/voicenav.js"></script>
</body>
</html>
